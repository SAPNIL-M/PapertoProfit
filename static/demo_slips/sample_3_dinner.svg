<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Courier+Prime:wght@700&amp;display=swap');
      .pen { font-family: 'Caveat', cursive, sans-serif; fill: #111827; }
      .stamp { font-family: 'Courier Prime', monospace; fill: #4b5563; font-weight: bold; }
    </style>
  </defs>

  <!-- Guest Check White Sheet with Perforations -->
  <rect x="15" y="15" width="370" height="520" rx="4" fill="#ffffff" filter="url(#paper-shadow)" stroke="#d1d5db" stroke-width="1.5"/>
  
  <text x="100" y="45" class="stamp" font-size="16">ROYAL SPICE DINER</text>
  <text x="130" y="65" class="stamp" font-size="12">GUEST ORDER PAD</text>
  <line x1="25" y1="75" x2="375" y2="75" stroke="#9ca3af" stroke-width="1"/>

  <text x="35" y="100" class="stamp" font-size="12">TABLE: <tspan class="pen" font-size="22">12 (Family Room)</tspan></text>
  <text x="240" y="100" class="stamp" font-size="12">SERVER: <tspan class="pen" font-size="22">Ramesh</tspan></text>
  <text x="35" y="125" class="stamp" font-size="12">TIME: <tspan class="pen" font-size="22">8:45 PM (Dinner)</tspan></text>
  <line x1="25" y1="135" x2="375" y2="135" stroke="#9ca3af" stroke-width="1"/>

  <!-- Items -->
  <text x="35" y="175" class="pen" font-size="24">2 x Paneer Butter Masala</text>
  <text x="325" y="175" class="pen" font-size="25">480</text>

  <text x="35" y="215" class="pen" font-size="24">4 x Garlic Naan (Butter)</text>
  <text x="325" y="215" class="pen" font-size="25">240</text>

  <text x="35" y="255" class="pen" font-size="24">2 x Half Chk Dum Biryani</text>
  <text x="325" y="255" class="pen" font-size="25">440</text>

  <text x="35" y="295" class="pen" font-size="24">1 x Jeera Rice Dal Tadka</text>
  <text x="325" y="295" class="pen" font-size="25">180</text>

  <text x="35" y="335" class="pen" font-size="24">3 x Gulab Jamun (Plate)</text>
  <text x="325" y="335" class="pen" font-size="25">150</text>

  <line x1="25" y1="410" x2="375" y2="410" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Totals -->
  <text x="180" y="440" class="pen" font-size="24">Subtotal:</text>
  <text x="320" y="440" class="pen" font-size="25">1490.00</text>

  <text x="180" y="470" class="pen" font-size="22">GST 5%:</text>
  <text x="330" y="470" class="pen" font-size="22">74.50</text>

  <line x1="160" y1="480" x2="375" y2="480" stroke="#111827" stroke-width="2"/>
  <text x="160" y="515" class="pen" font-size="32" font-weight="bold">BILL TOTAL:</text>
  <text x="275" y="515" class="pen" font-size="34" font-weight="bold">₹ 1564.50</text>
</svg>
